<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhool Pro Manual</title>
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #1c2333;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --orange: #d29922;
  --purple: #bc8cff;
  --sidebar-w: 280px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  display: flex;
  min-height: 100vh;
}
/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  position: fixed;
  top: 0; left: 0; bottom: 0;
  overflow-y: auto;
  padding: 20px 0;
  z-index: 10;
}
.sidebar h2 {
  font-size: 0.9rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text2);
  padding: 8px 20px;
  margin-top: 8px;
}
.sidebar a {
  display: block;
  padding: 6px 20px;
  color: var(--text2);
  text-decoration: none;
  font-size: 0.87rem;
  border-left: 2px solid transparent;
  transition: all 0.12s;
}
.sidebar a:hover { color: var(--text); background: var(--bg3); }
.sidebar a.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: rgba(88, 166, 255, 0.08);
  font-weight: 600;
}
/* Content */
.content {
  margin-left: var(--sidebar-w);
  flex: 1;
  max-width: 900px;
  padding: 40px 56px;
}
/* Markdown styles */
.markdown h1 {
  font-size: 2rem;
  font-weight: 800;
  margin: 0 0 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  color: #fff;
}
.markdown h2 { font-size: 1.4rem; margin: 32px 0 12px; color: #fff; font-weight: 700; }
.markdown h3 { font-size: 1.1rem; margin: 24px 0 10px; font-weight: 600; }
.markdown p { margin-bottom: 16px; }
.markdown ul, .markdown ol { margin-bottom: 16px; padding-left: 24px; }
.markdown li { margin-bottom: 4px; }
.markdown a { color: var(--accent); text-decoration: none; }
.markdown a:hover { text-decoration: underline; }
.markdown strong { color: #fff; }
.markdown blockquote {
  border-left: 4px solid var(--border);
  padding: 8px 16px;
  margin: 16px 0;
  color: var(--text2);
  background: var(--bg2);
  border-radius: 0 6px 6px 0;
}
.markdown table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0 24px;
  font-size: 0.88rem;
}
.markdown th, .markdown td {
  border: 1px solid var(--border);
  padding: 8px 14px;
  text-align: left;
}
.markdown th { background: var(--bg3); font-weight: 600; }
.markdown code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.85em;
  background: var(--bg3);
  padding: 2px 6px;
  border-radius: 4px;
  color: #f97583;
}
.markdown pre {
  background: #090c10;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  overflow-x: auto;
  margin: 16px 0 24px;
}
.markdown pre code {
  background: none;
  padding: 0;
  color: #e6edf3;
  font-size: 0.85rem;
  line-height: 1.6;
}
.markdown img {
  max-width: 100%;
  border-radius: 8px;
  border: 1px solid var(--border);
  margin: 16px 0;
}
.markdown hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 32px 0;
}
@media (max-width: 800px) {
  .sidebar { position: static; width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 300px; }
  .content { margin-left: 0; padding: 24px; }
  body { flex-direction: column; }
}
</style>
</head>
<body>

<nav class="sidebar" id="sidebar"></nav>

<main class="content">
  <div class="markdown" id="content"></div>
</main>

<script src="docs_bundle.js"></script>
<script>
(function() {
  var docs = window.DOCS_DATA;
  if (!docs) {
    document.getElementById('content').innerHTML = '<p>Loading documentation bundle...</p>';
    return;
  }

  var sidebar = document.getElementById('sidebar');
  var content = document.getElementById('content');

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderMarkdown(md) {
    var h = md
      .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
      .replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
        var c = escHtml(code);
        return '<pre><code>' + c + '</code></pre>';
      })
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/^### (.*$)/gm, '<h3>$1</h3>')
      .replace(/^## (.*$)/gm, '<h2>$1</h2>')
      .replace(/^# (.*$)/gm, '<h1>$1</h1>')
      .replace(/^\> (.*$)/gm, '<blockquote>$1</blockquote>')
      .replace(/^\* (.*$)/gm, '<li>$1</li>')
      .replace(/^- (.*$)/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>\n?)+/g, function(m) {
        return '<ul>' + m.replace(/\n/g, '') + '</ul>';
      })
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(_, alt, src) {
        var s = src;
        if (s.startsWith('demo-output/')) s = '../' + s;
        return '<img src="' + s + '" alt="' + escHtml(alt) + '">';
      })
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, text, url) {
        if (url.endsWith('.md')) {
          var id = url.replace(/^\.\.\//,'').replace(/\.md$/,'').replace(/\//g,'-');
          return '<a href="#' + id + '" onclick="loadDoc(\'' + id + '\');return false;">' + text + '</a>';
        }
        return '<a href="' + url + '">' + text + '</a>';
      })
      .replace(/\n\|(.+)\|\n(\|[ -:|]+\|)\n((?:\|.+\|\n?)*)/g, function(_, hdr, div, rows) {
        var th = hdr.split('|').filter(function(c){return c.trim()}).map(function(c){return '<th>'+c.trim()+'</th>'}).join('');
        var tr = rows.trim().split('\n').map(function(r){
          return '<tr>' + r.split('|').filter(function(c){return c.trim()}).map(function(c){return '<td>'+c.trim()+'</td>'}).join('') + '</tr>';
        }).join('');
        return '<table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table>';
      });

    var paragraphs = h.split('\n\n');
    var out = '';
    for (var i = 0; i < paragraphs.length; i++) {
      var p = paragraphs[i].trim();
      if (!p) continue;
      if (p.startsWith('<h') || p.startsWith('<table') || p.startsWith('<ul') || p.startsWith('<pre') || p.startsWith('<blockquote') || p.startsWith('<img') || p.startsWith('<li')) {
        out += p;
      } else {
        out += '<p>' + p.replace(/\n/g, '<br>') + '</p>';
      }
    }
    return out;
  }

  function buildSidebar() {
    var cats = {};
    docs.forEach(function(d) {
      if (!cats[d.category]) cats[d.category] = [];
      cats[d.category].push(d);
    });
    var html = '<h2 style="color: #fff; font-size: 1rem; padding: 0 20px 16px; text-transform: none; letter-spacing: 0;">Dhool Pro</h2>';
    for (var c in cats) {
      html += '<h2>' + c + '</h2>';
      cats[c].forEach(function(d) {
        html += '<a href="#' + d.id + '" id="nav-' + d.id + '" onclick="loadDoc(\'' + d.id + '\');return false;">' + escHtml(d.title) + '</a>';
      });
    }
    sidebar.innerHTML = html;
  }

  window.loadDoc = function(id) {
    var doc = docs.filter(function(d){ return d.id === id; })[0];
    if (!doc) {
      doc = docs.filter(function(d){ return d.id.indexOf(id) >= 0; })[0];
    }
    if (!doc) { content.innerHTML = '<p>Document not found.</p>'; return; }

    var links = sidebar.querySelectorAll('a');
    for (var i = 0; i < links.length; i++) links[i].classList.remove('active');
    var active = document.getElementById('nav-' + doc.id);
    if (active) active.classList.add('active');

    content.innerHTML = renderMarkdown(doc.content);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  buildSidebar();

  var hash = window.location.hash.replace(/^#/, '');
  window.loadDoc(hash || (docs.length > 0 ? docs[0].id : ''));
})();
</script>
</body>
</html>
