[package]
name = "dhool-pro"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "A reusable Rust game runtime with deterministic simulation and vendor-agnostic rendering"
repository = "https://git.jr4.in/jR4dh3y/dhool-pro"
keywords = ["game-engine", "rendering", "wgpu"]
categories = ["game-engines", "graphics", "rendering"]
exclude = [
    "/assets/**",
    "/demo-output/**",
    "/files/**",
    "/scripts/**",
    "*.md",
    "!/README.md",
]

[features]
default = []
demo-content = []

[lib]
name = "dhool_pro"
path = "src/lib.rs"

[[bin]]
name = "dhool-pro"
path = "src/main.rs"
required-features = ["demo-content"]

[[test]]
name = "renderer"
path = "tests/renderer.rs"
required-features = ["demo-content"]

[[test]]
name = "game_engine"
path = "tests/game_engine.rs"
required-features = ["demo-content"]

[build-dependencies]
cc = "1.2"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.33"
gltf = "1.4"
half = "2.6"
image = { version = "0.25", default-features = false, features = ["hdr", "jpeg", "png"] }
pollster = "0.4"
wgpu = { version = "29", default-features = false, features = ["std", "dx12", "gles", "vulkan", "wgsl"] }
winit = "0.30.12"

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
